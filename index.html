<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AngularTS</title>
    <link rel="shortcut icon" type="image/png" href="images/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script type="module" src="/src/index.ts"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        class Demo {
          constructor(Greeter) {
            this.greeter = Greeter;
          }
        }

        class Greeter {
          constructor() {
            this.greeting = "Hello";
          }

          greet() {
            this.greeting = this.greeting + " !";
          }
        }
        window.angular
          .createModule("todo", [])
          .service("Greeter", Greeter)
          .component("counterButton", {
            view: (res) => {
              const { scope } = res;
              res.scope.$ctrl.count = 0;
              return angular.view.tags.button(
                { onclick: () => res.scope.$ctrl.count++ },
                () => `Count: ${res.scope.$ctrl.count}`,
              );
            },
          })
          .controller("DemoCtrl", ["Greeter", Demo]);

        window.angular.bootstrap(document, ["todo"]);
      });
    </script>
  </head>
  <body>
    <main id="$ctrl" ng-controller="DemoCtrl as $ctrl">
      <h3>{{ $ctrl.greeter.greeting }}</h3>
      <button ng-click="$ctrl.greeter.greet()">Greet</button>
      <counter-button></counter-button>
      {{ $ctrl.count }}
    </main>
  </body>
</html>
