name: CI Pipeline

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Cache node_modules and Playwright
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Run lint check
        run: npx eslint ./src

  typescript:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Run TypeScript check
        run: npx tsc
      - name: Run test TypeScript check
        run: npx tsc --project tsconfig.test.json

  package:
    needs: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Verify package contents
        run: npm pack --dry-run

  playwright:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Run Playwright tests
        run: make coverage-check

      - name: Run Rust Wasm namespace parity check
        run: make -C integrations/wasm/rust parity
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  kotlin:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore node_modules and Playwright cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache Gradle and Kotlin/JS
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            integrations/kotlin/.gradle
            integrations/kotlin/kotlin-js-store
          key: kotlin-${{ runner.os }}-${{ hashFiles('integrations/kotlin/**/*.gradle.kts', 'integrations/kotlin/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      - name: Run Kotlin integration check
        run: make -C integrations/kotlin check

      - name: Run Rust Wasm namespace parity check
        run: make -C integrations/wasm/rust parity

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kotlin-playwright-report
          path: integrations/kotlin/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  dart:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - "3.6"
          - stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Restore node_modules and Playwright cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Generate TypeScript declarations
        run: make types

      - name: Run Dart release check
        run: make -C integrations/dart release-check

  gleam:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: erlef/setup-beam@v1
        with:
          gleam-version: "1.17.0"
          otp-version: "29"

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Generate TypeScript declarations
        run: make types

      - name: Run Gleam release check
        run: make -C integrations/gleam release-check

  scala:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - uses: sbt/setup-sbt@v1

      - name: Restore node_modules and Playwright cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache sbt and Scala artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            integrations/scala/target
            integrations/scala/project/target
            integrations/scala/examples/basic_app/target
          key: scala-${{ runner.os }}-jdk${{ matrix.java-version }}-${{ hashFiles('integrations/scala/build.sbt', 'integrations/scala/project/*.sbt', 'integrations/scala/project/build.properties', 'package-lock.json') }}
          restore-keys: |
            scala-${{ runner.os }}-jdk${{ matrix.java-version }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Scala.js integration check
        run: make -C integrations/scala check

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scala-playwright-report-jdk${{ matrix.java-version }}
          path: integrations/scala/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  csharp-wasm:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore node_modules and Playwright cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache NuGet and .NET workloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet
          key: csharp-wasm-${{ runner.os }}-${{ hashFiles('integrations/wasm/csharp/**/*.csproj', 'package-lock.json') }}
          restore-keys: |
            csharp-wasm-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install .NET WebAssembly workload
        run: dotnet workload install wasm-tools
        working-directory: integrations/wasm/csharp

      - name: Run C# Wasm integration check
        run: make -C integrations/wasm/csharp ci-check

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: csharp-wasm-playwright-report
          path: integrations/wasm/csharp/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  android:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            integrations/android/.gradle
          key: android-${{ runner.os }}-${{ hashFiles('integrations/android/**/*.gradle.kts', 'integrations/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Run Android integration check
        run: make -C integrations/android release-check

  android-connected:
    name: Android device ${{ matrix.device }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone-api-28
            runner: ubuntu-latest
            api-level: "28"
            evidence-api-level: 28
            profile: pixel_2
            form_factor: phone
            disable_animations: true
            benchmark: false
            checks: navigation-fragments:connectedCheck browser:connectedCheck credentials:connectedCheck maps:connectedCheck media:connectedCheck custom-elements-sample:connectedCheck demo:connectedCheck
          - device: phone-api-37
            runner: macos-15
            api-level: "37.0"
            evidence-api-level: 37
            profile: pixel_6
            form_factor: phone
            disable_animations: false
            benchmark: true
            checks: navigation-fragments:connectedCheck browser:connectedCheck credentials:connectedCheck maps:connectedCheck media:connectedCheck custom-elements-sample:connectedCheck demo:connectedCheck
          - device: tablet-api-37
            runner: macos-15
            api-level: "37.0"
            evidence-api-level: 37
            profile: pixel_tablet
            form_factor: tablet
            disable_animations: false
            benchmark: false
            checks: navigation-fragments:connectedCheck
          - device: foldable-api-37
            runner: macos-15
            api-level: "37.0"
            evidence-api-level: 37
            profile: 7.6in Foldable
            form_factor: foldable
            disable_animations: true
            benchmark: false
            checks: navigation-fragments:connectedCheck
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Android device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: ${{ matrix.disable_animations }}
          script: |
            ./integrations/android/gradlew -p integrations/android -Pandroid.testInstrumentationRunnerArguments.formFactor=${{ matrix.form_factor }} ${{ matrix.checks }}
            if [ "${{ matrix.benchmark }}" = "true" ]; then
              make -C integrations/android benchmark-emulator-smoke-check
            fi
            ./integrations/android/scripts/capture-device-evidence.sh \
              integrations/android/build/connected-device-evidence \
              ${{ matrix.evidence-api-level }} \
              ${{ matrix.device }}

      - name: Upload Android device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-device-evidence-${{ matrix.device }}
          path: integrations/android/build/connected-device-evidence
          if-no-files-found: error

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - setup
      - lint
      - typescript
      - package
      - playwright
      - kotlin
      - dart
      - gleam
      - scala
      - csharp-wasm
      - android
      - android-connected
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        if: >-
          needs.setup.result != 'success' ||
          needs.lint.result != 'success' ||
          needs.typescript.result != 'success' ||
          needs.package.result != 'success' ||
          needs.playwright.result != 'success' ||
          needs.kotlin.result != 'success' ||
          needs.dart.result != 'success' ||
          needs.gleam.result != 'success' ||
          needs.scala.result != 'success' ||
          needs.csharp-wasm.result != 'success' ||
          needs.android.result != 'success'
          || needs.android-connected.result != 'success'
        run: exit 1

      - name: Confirm CI completion
        run: echo "Every required CI job passed."
