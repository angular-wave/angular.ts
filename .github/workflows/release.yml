name: Release

run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag requiring npm/GitHub publication recovery
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Validate release secrets
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Require Maven Central credentials
        shell: bash
        env:
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          missing=()
          for name in \
            MAVEN_CENTRAL_TOKEN \
            MAVEN_CENTRAL_USERNAME \
            MAVEN_GPG_PRIVATE_KEY \
            MAVEN_GPG_PASSPHRASE
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

  verify:
    name: Verify release commit
    if: github.event_name == 'push'
    needs: release-preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-java:
    name: Publish Java package to Maven Central
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Maven Central publishing
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Install dependencies
        run: npm ci

      - name: Validate Java release metadata
        run: make -f integrations/closure/Makefile java-version-check

      - name: Reject an existing Maven Central version
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          pom_url="https://repo1.maven.org/maven2/io/github/angular-wave/angular-ts-java/$version/angular-ts-java-$version.pom"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$pom_url")"

          case "$status" in
            404) ;;
            200)
              echo "io.github.angular-wave:angular-ts-java:$version is already published" >&2
              exit 1
              ;;
            *)
              echo "Maven Central lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Publish Java package to Maven Central
        env:
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f integrations/closure/java/pom.xml
          -Prelease
          -Dgpg.signer=bc
          clean deploy

  publish-clojurescript:
    name: Publish ClojureScript package to Maven Central
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Maven Central publishing
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Install dependencies
        run: npm ci

      - name: Validate ClojureScript release metadata and package
        run: make -f integrations/closure/Makefile clojurescript-package-check

      - name: Reject an existing Maven Central version
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          pom_url="https://repo1.maven.org/maven2/io/github/angular-wave/angular-ts-cljs/$version/angular-ts-cljs-$version.pom"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$pom_url")"

          case "$status" in
            404) ;;
            200)
              echo "io.github.angular-wave:angular-ts-cljs:$version is already published" >&2
              exit 1
              ;;
            *)
              echo "Maven Central lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Publish ClojureScript package to Maven Central
        env:
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f integrations/closure/clojurescript/pom.xml
          -Prelease
          -Dgpg.signer=bc
          clean deploy

  publish:
    name: Publish npm package and GitHub Release
    needs:
      - verify
      - publish-java
      - publish-clojurescript
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        needs.verify.result == 'success' &&
        needs.publish-java.result == 'success' &&
        needs.publish-clojurescript.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6"

      - name: Install trusted-publishing npm version
        run: npm install --global npm@11.18.0

      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.RELEASE_TAG;
          const version = packageJson.version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;

          if (!semver.test(version)) {
            throw new Error(`package.json contains an invalid release version: ${version}`);
          }

          if (tag !== `v${version}`) {
            throw new Error(`Release tag ${tag} must exactly match package version v${version}`);
          }

          const prerelease = version.includes("-");
          const values = {
            name: packageJson.name,
            npm_tag: prerelease ? "next" : "latest",
            prerelease: String(prerelease),
            tag,
            version,
          };

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(""),
          );
          NODE

      - name: Reject an existing npm version
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm view "$PACKAGE_NAME" versions --json > "$RUNNER_TEMP/published-versions.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const versions = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/published-versions.json`, "utf8"),
          );

          if (versions.includes(process.env.PACKAGE_VERSION)) {
            throw new Error(
              `${process.env.PACKAGE_NAME}@${process.env.PACKAGE_VERSION} is already published`,
            );
          }
          NODE

      - name: Verify Maven artifacts before recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          java_pom="https://repo1.maven.org/maven2/io/github/angular-wave/angular-ts-java/$PACKAGE_VERSION/angular-ts-java-$PACKAGE_VERSION.pom"
          cljs_pom="https://repo1.maven.org/maven2/io/github/angular-wave/angular-ts-cljs/$PACKAGE_VERSION/angular-ts-cljs-$PACKAGE_VERSION.pom"
          curl --fail --silent --show-error "$java_pom" --output /dev/null
          curl --fail --silent --show-error "$cljs_pom" --output /dev/null

      - name: Extract curated release notes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node utils/extract-release-notes.mjs "$RELEASE_VERSION" \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        run: |
          make release-build
          make docs-requirement
          make version-check

      - name: Verify committed generated artifacts
        run: |
          git diff --exit-code -- \
            @types \
            dist \
            docs/static/typedoc \
            docs/layouts/partials/hooks/head-end.html \
            docs/layouts/shortcodes/version.html

      - name: Pack exact release artifact
        id: package
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const [pack] = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/npm-pack.json`, "utf8"),
          );

          if (pack.name !== process.env.PACKAGE_NAME) {
            throw new Error(`Packed ${pack.name}; expected ${process.env.PACKAGE_NAME}`);
          }

          if (pack.version !== process.env.PACKAGE_VERSION) {
            throw new Error(`Packed ${pack.version}; expected ${process.env.PACKAGE_VERSION}`);
          }

          if (pack.warnings?.length) {
            throw new Error(`npm pack warnings: ${pack.warnings.join("; ")}`);
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `tarball=release/${pack.filename}\n`,
          );
          NODE

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$TARBALL#npm package tarball" \
            --draft \
            --notes-file "$RELEASE_NOTES" \
            --verify-tag

      - name: Publish exact tarball to npm
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "./$TARBALL" --access public --tag "$NPM_TAG" --provenance

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease \
              --latest=false
          else
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease=false \
              --latest
          fi
